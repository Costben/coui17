<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title>COUI 17</title>
    <link rel="shortcut icon" href="./favicon.ico">
    <link href="styles.css" rel="stylesheet" type="text/css">
    <script>
        // Replays the phone's system bar insets so a browser capture can be compared with a device
        // capture one to one: ?insetTop=36.387&insetBottom=16 uses dp, matching the 141px/62px
        // insets measured on a 620dpi device. Must run before composeApp.js reads the values.
        (function () {
            var params = new URLSearchParams(window.location.search);
            if (!params.has("insetTop") && !params.has("insetBottom")) return;
            var style = document.documentElement.style;
            if (params.has("insetTop")) style.setProperty("--safe-area-inset-top", params.get("insetTop") + "px");
            if (params.has("insetBottom")) style.setProperty("--safe-area-inset-bottom", params.get("insetBottom") + "px");
        })();
    </script>
</head>
<body>
<div id="loading">Loading</div>
<!-- Dev-only wallpaper/insets toolbar. Starts hidden; the script at the end of <body> reveals it. -->
<div id="wallpaper-toolbar" role="toolbar" aria-label="Wallpaper preview controls" hidden>
    <label for="wallpaperInput">Wallpaper</label>
    <input id="wallpaperInput" type="file" accept="image/*" aria-label="Choose wallpaper">
    <button id="clearWallpaper" type="button">Clear</button>
    <button id="toggleInsets" type="button" aria-pressed="false">Insets: off</button>
    <span id="wallpaperStatus" aria-live="polite">Default</span>
</div>
<div id="composeApp"></div>
</body>
<script>
    // The toolbar is a dev tool, so it is only shown when asked for: ?tools, or any inset params.
    // The insets are read once during the first composition, so switching them reloads the page.
    (function () {
        var params = new URLSearchParams(window.location.search);
        var enabled = params.has("insetTop") || params.has("insetBottom");
        var toolbar = document.getElementById("wallpaper-toolbar");
        if (toolbar && (enabled || params.has("tools"))) toolbar.hidden = false;

        var button = document.getElementById("toggleInsets");
        if (!button) return;
        button.textContent = enabled ? "Insets: on" : "Insets: off";
        button.setAttribute("aria-pressed", enabled ? "true" : "false");
        button.addEventListener("click", function () {
            var next = new URLSearchParams(window.location.search);
            // Keep the toolbar reachable after the reload, even when it was only shown because of
            // the insets: otherwise turning insets off would hide the button that turns them on.
            next.set("tools", "");
            if (enabled) {
                next.delete("insetTop");
                next.delete("insetBottom");
            } else {
                next.set("insetTop", "36.387");
                next.set("insetBottom", "16");
            }
            var query = next.toString();
            window.location.search = query ? "?" + query : "";
        });
    })();
</script>
<script src="composeApp.js" type="application/javascript"></script>
</html>
