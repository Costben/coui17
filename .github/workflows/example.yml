name: Build Example App

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - "AGENT.md"
      - "UPSTREAM.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "CHANGELOG.md"
      - "NOTICE"
      - "THIRD-PARTY-LICENSES.md"
      - "docs/**"

# Cloud minutes are billed, so CI only builds the Android demo APK. Desktop, macOS, iOS and web
# builds, tests and publishing run locally or on the self-hosted Windows build machine instead.
concurrency:
  group: example-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Raise JVM heap for CI
        shell: bash
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx6g"
          } >> gradle.properties
      - name: Decode android signing key
        if: env.SIGNING_KEY != ''
        shell: bash
        run: echo "$SIGNING_KEY" | base64 -d > keystore.jks
      - name: Build android release APK
        run: ./gradlew :example:android:assembleRelease
        env:
          KEYSTORE_PATH: ${{ env.SIGNING_KEY != '' && '../../keystore.jks' || '' }}
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Rename android artifact
        shell: bash
        run: mv example/android/build/outputs/apk/release/*.apk COUI-android-universal-apk.apk
      - name: Upload COUI android artifact
        uses: actions/upload-artifact@v7
        with:
          name: COUI-android-universal-apk.apk
          path: COUI-android-universal-apk.apk
          archive: false

  post_telegram:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.ref_type != 'tag' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Post to Telegram ci channel
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_API_LINK: ${{ secrets.BOT_API_LINK }}
        run: bash .github/scripts/post_telegram.sh
