name: Publish SNAPSHOT

on:
  push:
    branches: ["main"]
    paths:
      - "coui-core/**"
      - "coui-ui/**"
      - "coui-preference/**"
      - "coui-shader/**"
      - "coui-blur/**"
      - "coui-squircle/**"
      - "coui-icons/**"
      - "coui-nav/**"
      - "coui-navigation3-ui/**"
      - "build-plugins/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    # Apple publications are skipped on Linux, so a SNAPSHOT built there ships without the
    # iOS/macOS coordinates. Publish from macOS, like release.yml does.
    runs-on: macos-26
    if: github.ref_type == 'branch'
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish SNAPSHOT to GitHub Packages
        run: ./gradlew --no-daemon --stacktrace publishAllToGithubPackages --no-configuration-cache
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      # Resolves the coordinates back out of GitHub Packages the way a downstream project does, so a
      # snapshot that uploaded but cannot be consumed fails here instead of at the consumer's desk.
      # `smokeLocalOnly` excludes the group from Maven Central, so nothing can satisfy it by accident.
      - name: Smoke-test the published coordinates
        run: |
          version="$(./gradlew -q --no-daemon printReleaseVersion | tail -1)"
          echo "Resolving $version from https://maven.pkg.github.com/${GITHUB_REPOSITORY}"
          ./gradlew --no-daemon --stacktrace -p smoke compileKotlin \
            -PcouiVersion="$version" \
            -PsmokeRepo="https://maven.pkg.github.com/${GITHUB_REPOSITORY}" \
            -PsmokeLocalOnly=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
