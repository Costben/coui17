name: Build Docs Page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "coui-ui/src/**"
      - "coui-preference/src/**"
      - "example/shared/src/**"
      - "example/web/src/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: docs/.nvmrc
          cache: yarn
          cache-dependency-path: docs/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Build API Docs
        run: |
          # Every published module generates its own Dokka HTML; the script collects
          # them into one tree so the site exposes all nine modules behind the stable
          # /coui/dokka/index.html entry point.
          ./gradlew dokkaGenerate -Prelease
          bash .github/scripts/build-dokka-site.sh
      - name: Build Web Demos
        run: |
          ./gradlew :docs:demo:jsBrowserDistribution
          mkdir -p ./docs/public/compose
          mv ./docs/demo/build/dist/js/productionExecutable/* ./docs/public/compose
          ./gradlew :example:web:wasmJsBrowserDistribution
          mkdir -p ./docs/public/example
          mv ./example/web/build/dist/wasmJs/productionExecutable/* ./docs/public/example
          ./gradlew :docs:iconGen:generateIcons
      - name: Build Docs
        run: |
          cd ./docs
          yarn install --immutable
          yarn docs:build
      - name: Upload Dokka output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dokka-html
          path: ./docs/public/dokka
          if-no-files-found: warn
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/.vitepress/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
