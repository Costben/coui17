name: Release

on:
  push:
    # Tags are matched without a paths filter: a tag push carries no reliable file
    # list, so combining `tags` with `paths` silently skips every release. The CI
    # workflow already gates main-branch content.
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.2.0"
        required: true
        type: string

permissions:
  contents: write

# Keyed on the tag that is actually being released, not on the branch a manual run was
# dispatched from: two runs for different tags must not serialise against each other, and two
# runs for the same tag must.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      gradle_args: ${{ steps.resolve.outputs.gradle_args }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the tag to a commit and derive the release version
        id: resolve
        run: bash .github/scripts/resolve-release-tag.sh "$TAG"

  verify:
    name: Behaviour tests on the released commit
    needs: resolve
    runs-on: ubuntu-latest
    env:
      GRADLE_RELEASE_ARGS: ${{ needs.resolve.outputs.gradle_args }}
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Assert the checkout is the released commit
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Prove the release is built from the tagged commit
        run: bash .github/scripts/test-release-tag-resolution.sh
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
      # Same gap as the CI desktop-tests job: the runner image has no CJK font, and the dialog
      # button tests measure real Chinese labels.
      - name: Install CJK fonts for the dialog text metrics
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check formatting and binary compatibility
        run: ./gradlew spotlessCheck apiCheck --no-daemon
      - name: Run the behaviour test suites
        run: ./gradlew :coui-nav:desktopTest :coui-ui:desktopTest :coui-preference:desktopTest --no-daemon
      - name: Re-run the known-unstable navigation test ten times
        run: bash .github/scripts/run-nav-stability-loop.sh 10
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  publish:
    name: Publish to Maven Central
    needs: [resolve, verify]
    # Building every target is the point of this job: a Linux runner silently drops the Apple
    # publications, which would ship a root module whose `available-at` references dangle.
    runs-on: macos-26
    env:
      GRADLE_RELEASE_ARGS: ${{ needs.resolve.outputs.gradle_args }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Assert the checkout is the released commit
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Prove the staged-repository checks reject a missing platform artifact
        run: bash .github/scripts/test-staged-repository-verification.sh
      - name: Prove the staging task graph cleans before every publish
        run: bash .github/scripts/test-publish-task-graph.sh
      - name: Prove the release-copy rules accept ordinary prose and reject signatures
        run: bash .github/scripts/test-release-notes-rendering.sh
      - name: Render and validate the release copy before anything is uploaded
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: bash .github/scripts/render-release-notes.sh "$RELEASE_VERSION" "$RUNNER_TEMP/notes"
      - name: Stage and verify the Maven Central repository
        run: |
          # GRADLE_RELEASE_ARGS carries several flags, so the word splitting below is intended.
          # shellcheck disable=SC2086
          ./gradlew verifyStagedMavenCentral $GRADLE_RELEASE_ARGS --no-daemon --no-configuration-cache --stacktrace
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Check Android AAR / desktop API-dump parity
        run: bash .github/scripts/check-api-platform-parity.sh
      - name: Consume the staged candidate before uploading it
        run: |
          set -euo pipefail
          version="${TAG#v}"
          ./gradlew -p smoke compileKotlin \
            -PcouiVersion="$version" \
            -PsmokeRepo="file://$PWD/build/publishing/mavenCentral" \
            -PsmokeLocalOnly=true \
            --no-daemon
      - name: Build an independent Android consumer at minSdk 23
        run: |
          set -euo pipefail
          bash verification/android-api23-consumer/verify.sh "${TAG#v}" "file://$PWD/build/publishing/mavenCentral"
      - name: Check 1.1.0 compatibility of the staged candidate
        run: |
          set -euo pipefail
          bash verification/compat-consumer/verify.sh "${TAG#v}" "file://$PWD/build/publishing/mavenCentral"
      - name: Consume the staged Apple and web artifacts as a downstream project
        run: |
          set -euo pipefail
          bash verification/apple-web-consumer/verify.sh "${TAG#v}" "file://$PWD/build/publishing/mavenCentral"
      - name: Upload the already-verified bundle to Maven Central
        run: |
          # shellcheck disable=SC2086
          ./gradlew publishToMavenCentral $GRADLE_RELEASE_ARGS --no-daemon --no-configuration-cache --stacktrace
        env:
          CENTRAL_TOKEN_ID: ${{ secrets.CENTRAL_TOKEN_ID }}
          CENTRAL_TOKEN_SECRET: ${{ secrets.CENTRAL_TOKEN_SECRET }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Upload the release bundle
        uses: actions/upload-artifact@v7
        with:
          name: maven-central-bundle
          path: build/publishing/*.zip
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.release_version }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Render and validate the release copy
        run: bash .github/scripts/render-release-notes.sh "$VERSION" "$RUNNER_TEMP/notes"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" \
            --title "$(cat "$RUNNER_TEMP/notes/title.txt")" \
            --notes-file "$RUNNER_TEMP/notes/body.md" \
            "${flags[@]}"

  central-smoke:
    name: Maven Central consumption smoke
    needs: [resolve, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.release_version }}
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Wait until Maven Central serves the release
        run: |
          set -euo pipefail
          for poll in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://repo1.maven.org/maven2/io/github/suqi8/coui/kmp/coui-ui/$VERSION/coui-ui-$VERSION.pom")
            if [ "$code" = "200" ]; then
              echo "coui-ui $VERSION is available on Maven Central (poll $poll)"
              exit 0
            fi
            sleep 20
          done
          echo "coui-ui $VERSION did not appear on Maven Central within 30 minutes"
          exit 1
      - name: Consume every published module from Maven Central
        run: |
          set -euo pipefail
          ./gradlew -p smoke compileKotlin -PcouiVersion="$VERSION" --no-daemon
