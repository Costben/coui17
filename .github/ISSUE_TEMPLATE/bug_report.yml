name: Bug report
description: Something in the library does not behave as documented or as the ColorOS reference does.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check:
        - this repository is a **downstream fork** of [`suqi8/coui`](https://github.com/suqi8/coui) — see `UPSTREAM.md`;
        - the problem still reproduces on the latest published version;
        - it is not a security issue (those go through `SECURITY.md`, not this tracker).

  - type: dropdown
    id: repository
    attributes:
      label: Which repository does this affect?
      description: Code inherited from upstream may need to be reported upstream instead.
      options:
        - This fork (coui17)
        - Upstream COUI (suqi8/coui)
        - Unsure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: COUI version
      description: The version of `io.github.suqi8.coui.kmp` you are using. Snapshots from `main` are acceptable — say which commit.
      placeholder: "1.2.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - macOS
        - Desktop (JVM)
        - Web (WasmJs)
        - Web (Js)
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: Module and component
      description: Which module, and which component or API.
      placeholder: "coui-ui — Slider"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happens
      description: Describe the problem, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        A snippet, a link to a repository, or the steps you took in the `example/` app.
        A report that cannot be reproduced cannot be acted on.
      render: kotlin
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, stack traces or screenshots
      description: Paste any relevant output. Screenshots are welcome for visual problems.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues for a duplicate.
          required: true
        - label: I am reporting against a published version, or I have named the commit I built.
          required: true
